name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Aarodynamicc
          outputs: |
            dist/github-snake.svg?color_snake=00c853&color_dots=ebedf0,b7f5c4,6fdc8c,2fb457,0b6b2a
            dist/github-snake-dark.svg?color_snake=00ff41&color_dots=161b22,0e4429,006d32,26a641,00ff41

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
