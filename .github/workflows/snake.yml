name: Charge the Ring (Generate Snake Animation)

on:
  schedule:
    - cron: "0 0 * * *"   # daily recharge at midnight UTC
  workflow_dispatch:       # manual recharge
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Forge the energy snake (ring construct)
        uses: Platane/snk@v3
        with:
          github_user_name: Aarodynamicc
          outputs: |
            dist/github-snake.svg?color_snake=%2300c853&color_dots=%23ebedf0,%23b7f5c4,%236fdc8c,%232fb457,%230b6b2a
            dist/github-snake-dark.svg?color_snake=%2300ff41&color_dots=%231b3a24,%230e5a2a,%23129b3f,%2300c853,%2300ff41

      - name: Deploy to the Power Battery (output branch)
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
